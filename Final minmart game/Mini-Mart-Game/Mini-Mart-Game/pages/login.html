<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Mart - Login</title>

    <!-- Loads the shared page styles. -->
    <link rel="stylesheet" href="../css/common.css">

    <!-- Loads styles for the login and signup forms. -->
    <link rel="stylesheet" href="../css/auth.css">

</head>


<body>

    <!-- Contains the full-page authentication layout. -->
    <div class="auth-page">


        <!-- Holds the image and authentication form. -->
        <div class="auth-container">


            <!-- Displays the Mini Mart background image. -->
            <img
                src="../images/mini.jpg"
                alt="Mini Mart Shop"
                class="auth-background-image"
            >


            <!-- Contains the login form and related links. -->
            <div class="auth-box">


                <!-- Displays the page title. -->
                <h1>Mini Mart</h1>

                <h2>Login</h2>


                <!-- Collects the username and password. -->
                <form id="loginForm">


                    <!-- Collects the player username. -->
                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        required
                    >


                    <!-- Collects the player password. -->
                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                    >


                    <!-- Submits the login details. -->
                    <button type="submit">
                        Login
                    </button>

                    <!-- Starts a guest session without creating an account. -->
                    

                </form>


                <!-- Opens the registration page. -->
                <p>
                    Don't have an account?
                    <a href="signup.html">
                        Sign Up
                    </a>
                </p>

                


            </div>

        </div>

    </div>


    <!-- Loads the script that checks login details. -->
    <script src="../js/auth/login.js"></script>

</body>

</html>
