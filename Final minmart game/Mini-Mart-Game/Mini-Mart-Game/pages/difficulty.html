<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Choose Difficulty | Mini Mart</title>

    <!-- Loads the stylesheets used by this page. -->
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/difficulty.css">

    <!-- Loads the fonts used by the page. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Skranji:wght@400;700&family=Ultra&display=swap"
        rel="stylesheet">

    <!-- Loads the script that handles page actions. -->
    <script src="../js/gameplay/levelManager.js" defer></script>
</head>

<body>

    <main class="difficulty-container">

        <section class="difficulty-card">

            <h1>MINI MART</h1>

            <h2>Choose Your Challenge!</h2>

            <p class="description">
                Welcome to your Mini Mart adventure!
                Choose your difficulty, serve your customers,
                collect points, and become a shopping superstar!
            </p>

            <!-- Displays the available game difficulty levels. -->
            <div class="difficulty-options">

                <!-- Displays the Easy difficulty option. -->
                <button
                    type="button"
                    class="difficulty-button easy"
                    onclick="selectDifficulty('easy')">


                    <span class="level-name">EASY</span>

                    <span class="level-description">
                        Take it easy!
                    </span>

                    <span class="level-detail">
                        ⏱ 90 Seconds · ❤️ 3 Lives
                    </span>

                </button>

                <!-- Displays the Medium difficulty option. -->
                <button
                    type="button"
                    class="difficulty-button medium"
                    onclick="selectDifficulty('medium')">

                    <span class="level-name">MEDIUM</span>

                    <span class="level-description">
                        Time to get busy!
                    </span>

                    <span class="level-detail">
                        ⏱ 75 Seconds · ❤️ 3 Lives
                    </span>

                </button>

                <!-- Displays the Difficult difficulty option. -->
                <button
                    type="button"
                    class="difficulty-button difficult"
                    onclick="selectDifficulty('difficult')">

                    <span class="level-name">DIFFICULT</span>

                    <span class="level-description">
                        Ready for the challenge?
                    </span>

                    <span class="level-detail">
                        ⏱ 60 Seconds · ❤️ 3 Lives
                    </span>

                </button>

            </div>

            <!-- Provides a link back to the menu. -->
            <button
                type="button"
                class="back-button"
                onclick="goBack()">

                 Back to Menu

            </button>

        </section>

    </main>

</body>

</html>
